name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "--- sdkmanager ---"
          sdkmanager --version 2>&1 || true
          echo "--- available files ---"
          ls -la

      - name: Install flet
        run: pip install flet==1.0.2 flet-cli==1.0.2

      - name: Build APK
        run: |
          flet build apk -v \
            --org com.example \
            --project fletdemo \
            --product "Flet Demo" \
            --build-version 1.0.0 \
            --build-number 1 \
            --module-name flet_test

      - name: List build output
        run: find build -type f -name '*.apk' 2>/dev/null || echo "No APK found in build/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fletdemo-apk
          path: build/apk/*.apk
          if-no-files-found: error
