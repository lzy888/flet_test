name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flet
        run: pip install flet==1.0.2 flet-cli==1.0.2

      - name: Build APK
        run: |
          flet build apk \
            --org com.example \
            --project fletdemo \
            --product "Flet 演示" \
            --build-version 1.0.0 \
            --build-number 1 \
            --module-name flet_test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fletdemo-apk
          path: build/apk/*.apk
          if-no-files-found: error
